name: Two-language plug-in tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Test both lexers and build the local gem
        run: |
          set -euo pipefail
          git rev-parse HEAD
          gem install rouge -v 5.1.0 --no-document
          gem install minitest -v 5.25.5 --no-document
          ruby -Ilib test/languages_test.rb
          gem build rouge-studiohaze.gemspec
